name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    # 📦 Upload report (déjà présent chez toi)
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # 📦 ZIP report pour email
    - name: Zip Playwright report
      if: ${{ !cancelled() }}
      run: zip -r playwright-report.zip playwright-report

    # 📧 SEND EMAIL
    - name: Send report by email
      if: ${{ !cancelled() }}
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASS }}
        subject: "📊 Playwright Test Report"
        to: ${{ secrets.EMAIL_TO }}
        from: "GitHub Actions"
        body: |
          Bonjour,

          Les tests Playwright sont terminés.

          📦 Le rapport est attaché en ZIP.

          🚀 Pipeline GitHub Actions terminé avec succès.
        attachments: playwright-report.zip